:root{

*{box-sizing:border-box}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

button{font:inherit;cursor:pointer}

.menu button:hover,.menu button.on{background:#4a4a4a}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#F2B45A;color:#2b1d00;font-size:11px;font-weight:700;margin-left:4px;line-height:18px;text-align:center}

.track{display:flex;gap:0;margin-top:12px}
.track div{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative;padding-top:22px}
.track div::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line)}
.track div::after{content:"";position:absolute;top:11px;left:calc(50% + 8px);right:calc(-50% + 8px);height:2px;background:var(--line)}
.track div:last-child::after{display:none}
.track div.done::before{background:var(--teal)} .track div.done{color:var(--title);font-weight:600}
.track div.refus::before{background:var(--no)} .track div.refus{color:var(--no);font-weight:600}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}

.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
.dl dt{color:var(--mut)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chatlist button{display:flex;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:8px;color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-height:440px;overflow-y:auto}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;background:var(--bubble);font-size:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff}

.notif{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}

.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;margin-top:7px}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--mut)}
.foot{background:var(--navy2);color:#aebfd0;font-size:12.5px;padding-block:16px;text-align:center}
.foot b{color:#fff}
@media(max-width:780px){.top{position:static}h1.centre{font-size:22px}.grid3,.grid2{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}
@media(prefers-reduced-motion:no-preference){main{animation:fade .25s ease}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>

  messages() {
    const autres = me.role === "stagiaire" ? S.users.filter(u => u.role === "gestionnaire") : S.users.filter(u => u.role === "stagiaire");

    <div class="chatlist">${autres.map(u => { const n = S.messages.filter(m => m.de === u.id && m.a === me.id && !m.lu).length;

      return `<button data-go="conv" data-p="${u.id}"><span><b>${esc(u.prenom)} ${esc(u.nom)}</b><br><small>${last ? esc(last.texte.slice(0, 60)) + (last.texte.length > 60 ? "…" : "") : "Aucun message"}</small></span>${n ? `<span class="pill">${n}</span>` : ""}</button>`; }).join("")}</div>`;

    const u = U(+param);
    const l = S.messages.filter(m => (m.de === u.id && m.a === me.id) || (m.a === u.id && m.de === me.id));
    l.forEach(m => { if (m.a === me.id) m.lu = true; }); save();

function table(l) {
  if (!l.length) return `<div class="empty">Aucune candidature dans cette catégorie.</div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Candidat(e)</th><th>Offre</th><th>Envoyée le</th><th>Statut</th><th></th></tr></thead><tbody>
  ${l.map(d => { const u = U(d.user), o = O(d.offre) || { titre: "Offre supprimée" }; return `<tr><td><b>${esc(u.prenom)} ${esc(u.nom)}</b><br><small>${esc(u.email)}</small></td><td>${esc(o.titre)}</td><td>${fd(d.date)}</td><td>${badge(d.statut)}</td><td><button class="btn sm ghost" data-go="gcand" data-p="${d.id}">Ouvrir</button></td></tr>`; }).join("")}</tbody></table></div>`;
}
const PRIVE = { candidats: "g", agents: "g", documents: "*", mes: "s", notifs: "s", candidater: "s", tableau: "g", gcands: "g", gcand: "g", goffres: "g", offreform: "g", messages: "*", conv: "*", profil: "*", admin: "a" };
function render() {
  const need = PRIVE[view];
  if (need && !me) { apres = { view, param }; view = "connexion"; flash = { t: "err", m: "Connectez-vous ou créez un compte pour continuer." }; }
  else if ((need === "g" && !isGest()) || (need === "a" && me.role !== "admin") || (need === "s" && me.role !== "stagiaire")) { view = isGest() ? "tableau" : "offres"; flash = { t: "err", m: "Cette page n'est pas accessible avec votre rôle." }; }
  document.getElementById("nav").innerHTML = navHtml();
  const body = V[view]() || "";
  document.getElementById("app").innerHTML = (flash ? `<p class="flash ${flash.t}">${esc(flash.m)}</p>` : "") + body;
  document.getElementById("nav").innerHTML = navHtml();
  const c = document.getElementById("chat"); if (c) c.scrollTop = c.scrollHeight;
  flash = null;
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); return go(g.dataset.go, g.dataset.p ?? null); }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, i = +a.dataset.id;
  if (act === "logout") { me = null; try { sessionStorage.removeItem(KEY + "-me"); } catch (e) {} return go("accueil", null, { t: "ok", m: "Vous êtes déconnecté(e)." }); }
  if (act === "quick") return login(U(i));
  if (act === "ecrire") return go("conv", i);
  if (act === "valider" || act === "refuser" || act === "rouvrir") {
    const d = S.demandes.find(x => x.id === i), o = O(d.offre);
    if (d.statut === "validée" && o) o.places++;
    if (act === "valider") { if (!o || o.places <= 0) return go("gcand", i, { t: "err", m: "Plus de place disponible sur cette offre." }); o.places--; d.statut = "validée"; }
    else d.statut = act === "refuser" ? "refusée" : "en attente";
    if (act !== "rouvrir") notify(d.user, `Votre candidature « ${o ? o.titre : ""} » a été ${d.statut}.`);
    save(); return go("gcand", i, { t: "ok", m: act === "rouvrir" ? "La candidature est de nouveau en attente." : `Candidature ${d.statut}. Le candidat a été prévenu.` });
  }
  if (act === "delOffre") { S.offres = S.offres.filter(o => o.id !== i); save(); return go("goffres", null, { t: "ok", m: "Offre supprimée." }); }
});
document.addEventListener("change", e => {
  const s = e.target.closest("[data-role]"); if (!s) return;
  U(+s.dataset.role).role = s.value; save(); go("admin", null, { t: "ok", m: "Rôle mis à jour." });
});
const val = i => document.getElementById(i).value.trim();
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target.id;
  if (f === "f-login") { const u = S.users.find(x => x.email.toLowerCase() === val("l-email").toLowerCase() && x.mdp === document.getElementById("l-mdp").value); return u ? login(u) : go("connexion", null, { t: "err", m: "E-mail ou mot de passe incorrect." }); }
  if (f === "f-reg") {
    const email = val("r-email").toLowerCase();
    if (S.users.some(u => u.email.toLowerCase() === email)) return go("inscription", null, { t: "err", m: "Un compte existe déjà avec cette adresse e-mail." });
    const u = { id: id(), nom: val("r-nom").toUpperCase(), prenom: val("r-prenom"), email, mdp: document.getElementById("r-mdp").value, role: "stagiaire" };
    S.users.push(u); save(); return login(u);
  }
  if (f === "f-cand") {
    const files = { cv: "c-cv", lettre: "c-lm", convention: "c-conv" }, out = {};
    for (const [k, idf] of Object.entries(files)) {
      const fl = document.getElementById(idf).files[0];
      if (!fl) { out[k] = null; continue; }
      if (!/\.pdf$/i.test(fl.name) && fl.type !== "application/pdf") { flash = { t: "err", m: `« ${fl.name} » n'est pas un PDF. Seuls les fichiers PDF sont acceptés.` }; return render(); }
      if (fl.size > 5 * 1024 * 1024) { flash = { t: "err", m: `« ${fl.name} » dépasse 5 Mo.` }; return render(); }
      out[k] = fl.name;
    }
    Object.assign(me, { nom: val("c-nom"), prenom: val("c-prenom"), telephone: val("c-tel"), naissance: val("c-naiss"), adresse: val("c-adr") });
    const o = O(+param);
    if (o.limite && o.limite < jour(0)) { flash = { t: "err", m: "La date limite pour postuler à cette offre est dépassée." }; return render(); }
    S.demandes.push({ id: id(), user: me.id, offre: o.id, ...out, message: val("c-msg") || null, statut: "en attente", date: today() });
    notify(me.id, `Votre candidature « ${o.titre} » a bien été reçue. Le service vous répondra rapidement.`);
    save(); return go("mes", null, { t: "ok", m: "Candidature envoyée. Vous avez reçu une confirmation." });
  }
  if (f === "f-offre") {
    const data = { titre: val("o-titre"), departement: val("o-dep"), description: val("o-desc"), debut: val("o-deb"), fin: val("o-fin"), places: +val("o-pl"), limite: val("o-lim") };
    if (data.fin < data.debut) { flash = { t: "err", m: "La date de fin doit être après la date de début." }; return render(); }
    if (param) Object.assign(O(+param), data); else S.offres.unshift({ id: id(), ...data, publication: jour(0) });
    save(); return go("goffres", null, { t: "ok", m: param ? "Offre modifiée." : "Offre publiée." });
  }
  if (f === "f-msg") { S.messages.push({ id: id(), de: me.id, a: +param, texte: val("m-txt"), lu: false, date: today() }); save(); return go("conv", param); }
  if (f === "f-prof") { Object.assign(me, { nom: val("p-nom"), prenom: val("p-prenom"), telephone: val("p-tel"), naissance: val("p-naiss"), adresse: val("p-adr") }); save(); return go("profil", null, { t: "ok", m: "Profil enregistré." }); }
});
document.getElementById("reset").addEventListener("click", () => { S = seed(); save(); me = null; try { sessionStorage.removeItem(KEY + "-me"); } catch (e) {} go("accueil", null, { t: "ok", m: "Les exemples ont été remis à zéro." }); });
render();
</script>
